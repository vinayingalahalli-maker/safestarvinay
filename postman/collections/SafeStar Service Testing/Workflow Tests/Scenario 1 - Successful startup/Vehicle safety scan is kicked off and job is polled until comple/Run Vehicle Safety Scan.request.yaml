$kind: http-request
url: "{{baseUrl}}/run"
method: POST
headers:
  x-mock-response-code: "201"
body:
  type: json
  content: |-
    {
      "vehicle": "{{vehicleID}}",
      "driver": "{{driverID}}"
    }
auth:
  type: jwt
  credentials:
    isSecretBase64Encoded: true
    secret: "{{jwtSecret}}"
    algorithm: HS256
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
scripts:
  - type: afterResponse
    code: |-
      

      pm.collectionVariables.set("safetyScanID", pm.response.json().run);
    language: text/javascript
order: 1000
